include:
  - local: .gitlab/ci/brief-delivery.yml

pages:
  stage: deploy
  image: harbor.focuscell.org/dockerhub-proxy/library/node:25-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check
    - npm run typecheck:ts7
    - npm run test
    - npm run build
    - npm run audit:routes
    - npm run audit:media
    - mv dist .pages
    - rm -rf public
    - mv .pages public
  artifacts:
    paths:
      - public
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo"'
